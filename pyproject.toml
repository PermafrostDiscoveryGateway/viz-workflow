[project]
name = "pdgworkflow"
version = "1.1.1"
description = "PDG Visualization workflow."
authors = [
    {name = "Robyn Thiessen-Bock", email = "thiessenbock@nceas.ucsb.edu"},
    {name = "Juliet Cohen", email = "jcohen@nceas.ucsb.edu"},
    {name = "Lauren Walker", email = "walker@nceas.ucsb.edu"},
    {name = "Matthew B. Jones", email = "jones@nceas.ucsb.edu"},
    {name = "Rushiraj Nenuji", email = "nenuji@nceas.ucsb.edu"},
    {name = "Alyona Kosobokova", email = "alyonak@nceas.ucsb.edu"},
    {name = "Jim Regetz", email = "regetz@nceas.ucsb.edu"}
]
license = {text = "Apache Software License 2.0"}
readme = "README.md"
requires-python = ">= 3.11"
keywords = ["pdg_workflow"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Click >= 7.0",
    "pdgraster @ git+https://github.com/PermafrostDiscoveryGateway/viz-raster.git@6f93480c14c9a853965f0b3ed4193bb37aa07cfb",
    "pdgstaging @ git+https://github.com/PermafrostDiscoveryGateway/viz-staging.git@2ae4825c3fe19191aaf280d6891570562932df17",
    "pdg3dtiles @ git+https://github.com/PermafrostDiscoveryGateway/viz-3dtiles.git@3d111c04f86dfb8a607dcc0aa33ae14cc3ea7ab3",
]

[project.urls]
Homepage = "https://github.com/PermafrostDiscoveryGateway/viz-workflow"
Repository = "https://github.com/PermafrostDiscoveryGateway/viz-workflow"

[project.optional-dependencies]
dev = [
    "pytest >= 7",
    "pre-commit >= 4.1",
    "black >= 24.1.1",
    "flake8 >= 7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = "\\.pyi?$"
